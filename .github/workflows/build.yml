name: Build diagnostic firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize west workspace
        run: west init -l config

      - name: Update west dependencies
        run: west update --fetch-opt=--filter=tree:0

      - name: Export Zephyr package
        run: west zephyr-export

      - name: Build standalone Zephyr diagnostic
        run: |
          west build -s bare -d build -b eyelash_nano -- \
            -DBOARD_ROOT=${GITHUB_WORKSPACE}/bare \
            -DCONF_FILE=${GITHUB_WORKSPACE}/bare/prj.conf

      - name: Collect firmware files
        run: |
          mkdir -p artifacts
          for ext in uf2 bin hex elf; do
            source="build/zephyr/zephyr.${ext}"
            if [ -f "${source}" ]; then
              cp "${source}" "artifacts/supermini-i2c-diagnostic.${ext}"
            fi
          done
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermini-i2c-diagnostic
          path: artifacts/
