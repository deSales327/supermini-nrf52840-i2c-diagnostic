name: Build diagnostic firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize west workspace
        run: west init -l config

      - name: Update west dependencies
        run: west update --fetch-opt=--filter=tree:0

      - name: Export Zephyr package
        run: west zephyr-export

      - name: Build SuperMini diagnostic
        run: |
          west build -s zmk/app -d build -b eyelash_nano -- \
            -DZMK_CONFIG=${GITHUB_WORKSPACE}/config \
            -DSHIELD=supermini_diag \
            -DZMK_EXTRA_MODULES=${GITHUB_WORKSPACE}

      - name: Collect firmware files
        run: |
          mkdir -p artifacts
          for ext in uf2 bin hex elf; do
            source="build/zephyr/zephyr.${ext}"
            if [ -f "${source}" ]; then
              cp "${source}" "artifacts/supermini-i2c-diagnostic.${ext}"
            fi
          done
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 artifacts/supermini-i2c-diagnostic.uf2
          fi
          test -n "$(find artifacts -maxdepth 1 -type f -print -quit)"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: supermini-i2c-diagnostic
          path: artifacts/
